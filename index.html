<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>صدای پرواز | آرشیو موسیقی</title>

<style>

*{
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{
margin:0;
background:#050505;
color:white;
}

/* بنر سینمایی */

.hero{
height:500px;
position:relative;
overflow:hidden;
}

.hero img{
width:100%;
height:100%;
object-fit:cover;
filter:brightness(40%);
}

.hero-text{
position:absolute;
top:50%;
right:50%;
transform:translate(50%,-50%);
text-align:center;
}

.hero-text h1{
font-size:55px;
color:#d4af37;
margin:0;
}

.hero-text p{
font-size:22px;
}


/* جستجو */

.search-box{
text-align:center;
padding:30px;
}

#search{
width:90%;
max-width:500px;
padding:15px;
border-radius:30px;
border:none;
font-size:16px;
}


/* پخش کننده */

.player{
width:90%;
max-width:500px;
margin:20px auto;
background:#111;
border:1px solid #d4af37;
border-radius:25px;
padding:25px;
text-align:center;
}

.player img{
width:230px;
height:230px;
border-radius:20px;
object-fit:cover;
}

audio{
width:100%;
margin:20px 0;
}

button{
background:#d4af37;
color:#000;
border:none;
padding:12px 25px;
border-radius:30px;
font-weight:bold;
cursor:pointer;
}

#playlist{
width:90%;
max-width:650px;
margin:auto;
}

.song{
display:flex;
align-items:center;
gap:15px;
background:#111;
border:1px solid #333;
padding:15px;
margin:15px 0;
border-radius:20px;
cursor:pointer;
}

.song:hover{
border-color:#d4af37;
}

.song img{
width:75px;
height:75px;
border-radius:15px;
object-fit:cover;
}

footer{
text-align:center;
padding:40px;
color:#aaa;
}

</style>

</head><body>


<div class="hero">

<img src="cover1.jpg" alt="صدای پرواز">

<div class="hero-text">

<h1>🎵 صدای پرواز</h1>

<p>آرشیو موسیقی و احساس</p>

</div>

</div>



<div class="search-box">

<input id="search" placeholder="🔍 جستجوی آهنگ یا خواننده">

</div>



<div class="player">

<img id="cover" src="cover1.jpg">


<h2 id="title">
پرواز عشق
</h2>


<p id="artist">
صدای پرواز
</p>


<audio id="audio" controls></audio>


<br><div class="equalizer" id="equalizer">
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
  <span></span>
</div>


<button onclick="prevSong()">
⏮ قبلی
</button>


<button onclick="nextSong()">
بعدی ⏭
</button>


</div>



<div id="playlist"></div>



<footer>

© 2026 صدای پرواز

</footer>




<script>


const songs=[

{
title:"پرواز عشق",
artist:"صدای پرواز",
file:"music.mp3"
},

{
title:"آسمان من",
artist:"صدای پرواز",
file:"music1.mp3"
},

{
title:"خاطره",
artist:"صدای پرواز",
file:"song3.mp3"
}

];


let current=0;


const audio=document.getElementById("audio");

const cover=document.getElementById("cover");

const title=document.getElementById("title");

const artist=document.getElementById("artist");

const playlist=document.getElementById("playlist");



function loadSong(index){

current=index;

let song=songs[index];

title.innerHTML=song.title;

artist.innerHTML=song.artist;

audio.src=song.file;

cover.src="cover1.jpg";

}



function showSongs(list){

playlist.innerHTML="";


list.forEach((song,index)=>{


let box=document.createElement("div");


box.className="song";


box.innerHTML=`

<img src="cover1.jpg">

<div>

<h3>${song.title}</h3>

<p>${song.artist}</p>

</div>

`;


box.onclick=function(){

loadSong(index);

audio.play();

};


playlist.appendChild(box);


});


}



function nextSong(){

current++;

if(current>=songs.length){

current=0;

}

loadSong(current);

audio.play();

}



function prevSong(){

current--;

if(current<0){

current=songs.length-1;

}

loadSong(current);

audio.play();

}




document.getElementById("search").oninput=function(){


let text=this.value;


let result=songs.filter(song=>

song.title.includes(text)

);


showSongs(result);


};




showSongs(songs);

loadSong(0);


</script>


</body>

</html>
