<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صدای پرواز واحساس | سایت موزیک</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #111827, #312e81, #7c2d12);
      color: white;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 45px 20px 30px;
    }

    header h1 {
      font-size: 38px;
      margin: 0 0 10px;
    }

    header p {
      color: #ddd;
      font-size: 17px;
    }

    .music-box {
      width: 90%;
      max-width: 700px;
      margin: 25px auto;
      padding: 25px;
      border-radius: 25px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 35px rgba(0,0,0,0.3);
    }

    .music-box h2 {
      margin-top: 0;
    }

    audio {
      width: 100%;
      margin-top: 15px;
    }

    .song {
      margin-top: 20px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(0,0,0,0.25);
    }

    footer {
      text-align: center;
      padding: 40px 10px;
      color: #ccc;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎵 صدای پرواز</h1>
    <p>موسیقی، عشق و احساس</p>
  </header>

  <div class="music-box">

    <div class="song">
      <h2>🎶 آهنگ‌های من</h2>
      <p>به‌زودی آهنگ‌های جدید اینجا قرار می‌گیرند.</p>

      <audio controls>
        <audio>
    <source src="music.mp3" type="audio/mpeg">
    مرورگر شما از پخش موسیقی پشتیبانی نمی‌کند.
</audio>
    
    
  

  </div>

  <footer>
    © 2026 صدای پرواز
  </footer>

</body>
</html>
