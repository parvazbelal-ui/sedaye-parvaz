<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>صدای پرواز | آرشیو موسیقی</title>


<style>

*{
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}


body{

margin:0;

background:
linear-gradient(135deg,#020617,#312e81,#9333ea);

color:white;

min-height:100vh;

}


header{

text-align:center;

padding:40px 20px;

}


header h1{

font-size:40px;

margin-bottom:10px;

}


header p{

color:#ddd;

font-size:18px;

}


#search{

width:90%;

max-width:500px;

padding:15px;

border-radius:30px;

border:none;

font-size:16px;

text-align:center;

}




.player{

width:90%;

max-width:500px;

margin:20px auto;

background:#ffffff22;

backdrop-filter:blur(15px);

padding:25px;

border-radius:25px;

text-align:center;

}



.player img{

width:220px;

height:220px;

object-fit:cover;

border-radius:20px;

}



audio{

width:100%;

margin:20px 0;

}



button{

padding:12px 25px;

border:none;

border-radius:25px;

background:#a855f7;

color:white;

margin:5px;

}



#playlist{

width:90%;

max-width:600px;

margin:30px auto;

}



.song{

display:flex;

align-items:center;

gap:15px;

background:#ffffff22;

padding:15px;

margin:12px 0;

border-radius:20px;

cursor:pointer;

}



.song img{

width:70px;

height:70px;

border-radius:15px;

object-fit:cover;

}



.song h3{

margin:0;

}



footer{

text-align:center;

padding:30px;

color:#ccc;

}


</style>

</head>



<body>


<header>

<h1>
🎵 صدای پرواز
</h1>

<p>
آرشیو موسیقی و احساس
</p>


<input id="search"
placeholder="🔍 جستجوی آهنگ یا خواننده">


</header>



<div class="player">


<img id="cover" src="images/cover1.jpg">


<h2 id="title">
پرواز عشق
</h2>


<p id="artist">
صدای پرواز
</p>



<audio id="audio" controls></audio>


<br>


<button onclick="prevSong()">
⏮ قبلی
</button>


<button onclick="nextSong()">
بعدی ⏭
</button>


</div>




<div id="playlist"></div>



<footer>

© 2026 صدای پرواز

</footer>





<script>


const songs=[


{
title:"پرواز عشق",
artist:"صدای پرواز",
file:"music.mp3",
cover:"images/cover1.jpg"
},


{
title:"آسمان من",
artist:"صدای پرواز",
file:"music/song2.mp3",
cover:"images/cover2.jpg"
},


{
title:"خاطره",
artist:"صدای پرواز",
file:"music/song3.mp3",
cover:"images/cover3.jpg"
}


];



let current=0;


const audio=document.getElementById("audio");

const cover=document.getElementById("cover");

const title=document.getElementById("title");

const artist=document.getElementById("artist");

const playlist=document.getElementById("playlist");





function loadSong(index){

current=index;

let song=songs[index];


title.innerHTML=song.title;

artist.innerHTML=song.artist;

cover.src=song.cover;

audio.src=song.file;


}




function showSongs(list){


playlist.innerHTML="";


list.forEach((song)=>{


let index=songs.indexOf(song);


let box=document.createElement("div");


box.className="song";


box.innerHTML=

`

<img src="${song.cover}">

<div>

<h3>${song.title}</h3>

<p>${song.artist}</p>

</div>

`;


box.onclick=function(){

loadSong(index);

audio.play();

};


playlist.appendChild(box);


});


}





function nextSong(){

current++;

if(current>=songs.length)

current=0;


loadSong(current);

audio.play();

}



function prevSong(){

current--;

if(current<0)

current=songs.length-1;


loadSong(current);

audio.play();

}




document
.getElementById("search")
.addEventListener("input",function(){


let text=this.value;


let result=songs.filter(song=>

song.title.includes(text)

||

song.artist.includes(text)

);


showSongs(result);


});




showSongs(songs);

loadSong(0);


</script>


</body>

</html>
